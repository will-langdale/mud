name: CI
on:
  pull_request:
    branches:
      - main

jobs:
  format-lint-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup
        uses: ./.github/actions/setup
        with:
          install-bun: "true"

      - name: Format and lint
        run: just format

      - name: Type check
        run: just check

  run-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run Python tests
        run: just test

  build-game:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup
        uses: ./.github/actions/setup

      - run: just build

  ci-success:
    needs: [format-lint-check, run-tests, build-game]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: CI Success
        run: echo "All CI checks passed!"
