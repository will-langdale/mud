name: CD

on:
  release:
    types: [published]

jobs:
  build-game:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build game
        run: just build

      - name: Upload built game
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: game-build
          path: ./src/mud/build/web.zip

  deploy-package:
    needs: build-game
    name: Upload release to itch.io
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Setup butler
        uses: remarkablegames/setup-butler@86d7a82798bd37fc2bae2db5721995ed06eaa9f8 # v3.0.0

      - name: Download built game
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: game-build

      - name: Upload to itch.io
        run: butler push web.zip illiter8/mud:html
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
