repos:
  - repo: local
    hooks:
      # Run linter and formatter using just command
      - id: ruff
        name: Lint and format
        description: "Format Python code using ruff format via just command"
        entry: just format
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        stages: [pre-commit]

      # Run the type checker
      - id: ty
        name: Type check
        description: "Type check Python code using ty check via just command"
        entry: just check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        stages: [pre-commit]

      # Check build
      - id: build
        name: Build game
        description: "Build the game via just command"
        entry: just build
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        stages: [pre-commit]
